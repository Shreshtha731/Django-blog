<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Chronicle{% endblock %}</title>

  <!-- Prevent Theme Flicker -->
  <script>
    if (
      localStorage.getItem('theme') === 'dark' ||
      (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)
    ) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  </script>

  <!-- Tailwind CSS CDN with Typography plugin -->
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    @keyframes blob-float {
      0%, 100% {
        transform: translate(0px, 0px) scale(1);
      }
      33% {
        transform: translate(30px, -50px) scale(1.08);
      }
      66% {
        transform: translate(-20px, 20px) scale(0.95);
      }
    }

    .animate-blob {
      animation: blob-float 18s infinite ease-in-out;
    }

    .animation-delay-2000 {
      animation-delay: 4s;
    }

    .animation-delay-4000 {
      animation-delay: 8s;
    }

    @media (prefers-reduced-motion: reduce) {
      .animate-blob {
        animation: none;
      }
    }
  </style>
</head>

<body class="relative flex min-h-screen flex-col bg-zinc-50 font-sans text-zinc-900 antialiased selection:bg-indigo-500 selection:text-white transition-colors duration-300 dark:bg-zinc-950 dark:text-zinc-100">

  <!-- Ambient Animated Background Layer -->
  <div class="pointer-events-none fixed inset-0 -z-10 overflow-hidden" aria-hidden="true">
    <div class="animate-blob absolute -left-40 -top-40 h-[520px] w-[520px] rounded-full bg-gradient-to-tr from-indigo-500/20 via-purple-500/15 to-transparent blur-3xl transition-opacity duration-1000 dark:from-indigo-600/15 dark:via-purple-600/10 dark:to-transparent"></div>
    <div class="animate-blob animation-delay-2000 absolute -right-32 top-1/3 h-[600px] w-[600px] rounded-full bg-gradient-to-br from-blue-500/15 via-indigo-500/10 to-transparent blur-3xl transition-opacity duration-1000 dark:from-blue-600/10 dark:via-indigo-900/20 dark:to-transparent"></div>
    <div class="animate-blob animation-delay-4000 absolute -bottom-16 left-1/4 h-[560px] w-[560px] rounded-full bg-gradient-to-tl from-violet-500/15 via-rose-500/10 to-transparent blur-3xl transition-opacity duration-1000 dark:from-violet-950/20 dark:via-zinc-900/40 dark:to-transparent"></div>
    <div class="absolute inset-0 bg-[radial-gradient(#e4e4e7_1px,transparent_1px)] [background-size:24px_24px] opacity-60 dark:bg-[radial-gradient(#27272a_1px,transparent_1px)] dark:opacity-40"></div>
  </div>

  <!-- Header Navigation -->
  <header class="sticky top-0 z-40 w-full border-b border-zinc-200/80 bg-white/80 backdrop-blur-md transition-colors dark:border-zinc-800/80 dark:bg-zinc-950/80">
    <div class="mx-auto flex h-16 max-w-5xl items-center justify-between px-4 sm:px-6 lg:px-8">
      <a href="{% url 'home' %}" class="text-lg font-black tracking-wider uppercase text-zinc-950 transition hover:opacity-80 dark:text-white">
        CHRONICLE<span class="text-indigo-600 dark:text-indigo-400">.</span>
      </a>

      <nav class="flex items-center gap-6 text-sm font-medium">
        <a href="{% url 'home' %}" class="text-zinc-600 transition hover:text-zinc-950 dark:text-zinc-400 dark:hover:text-white">
          Home
        </a>
        <a href="{% url 'all-posts' %}" class="text-zinc-600 transition hover:text-zinc-950 dark:text-zinc-400 dark:hover:text-white">
          All Posts
        </a>
      </nav>
    </div>
  </header>

  <!-- Page Main Content Block -->
  <main class="mx-auto w-full max-w-5xl flex-1 px-4 py-10 sm:px-6 lg:px-8">
    {% block content %}
    {% endblock %}
  </main>

  <!-- Footer -->
  <footer class="mt-auto border-t border-zinc-200/80 py-8 text-center text-xs text-zinc-500 dark:border-zinc-800/80 dark:text-zinc-500">
    <div class="mx-auto max-w-5xl px-4 sm:px-6 lg:px-8">
      <p>&copy; {% now "Y" %} Chronicle. All rights reserved.</p>
    </div>
  </footer>

  <!-- Floating Theme Toggle (Bottom-Left with Alt+T hotkey & tactile sound) -->
  <aside class="fixed bottom-6 left-6 z-50">
    <button
      id="theme-toggle"
      type="button"
      aria-label="Toggle dark mode"
      title="Toggle theme (Alt + T)"
      class="group flex h-10 w-10 items-center justify-center rounded-full border border-zinc-200/80 bg-white/90 text-zinc-600 shadow-md backdrop-blur-md transition-all duration-300 hover:scale-110 hover:text-zinc-950 dark:border-zinc-800 dark:bg-zinc-900/90 dark:text-zinc-400 dark:hover:text-white"
    >
      <!-- Sun Icon (Active in Dark Mode) -->
      <svg id="theme-toggle-light-icon" class="hidden h-5 w-5 transition-transform duration-500 group-hover:rotate-90" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
      </svg>

      <!-- Moon Icon (Active in Light Mode) -->
      <svg id="theme-toggle-dark-icon" class="hidden h-5 w-5 transition-transform duration-500 group-hover:-rotate-12" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
      </svg>
    </button>
  </aside>

  <!-- Interactive Dark Mode Controller -->
  <script>
    (function () {
      const toggleBtn = document.getElementById('theme-toggle');
      const darkIcon = document.getElementById('theme-toggle-dark-icon');
      const lightIcon = document.getElementById('theme-toggle-light-icon');

      function updateIcons() {
        const isDark = document.documentElement.classList.contains('dark');
        if (isDark) {
          lightIcon.classList.remove('hidden');
          darkIcon.classList.add('hidden');
        } else {
          lightIcon.classList.add('hidden');
          darkIcon.classList.remove('hidden');
        }
      }

      function playTactileFeedback() {
        try {
          const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();

          osc.type = 'sine';
          osc.frequency.setValueAtTime(
            document.documentElement.classList.contains('dark') ? 480 : 340,
            audioCtx.currentTime
          );
          gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.08);

          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.08);
        } catch (e) {
          // AudioContext blocked or unsupported
        }
      }

      function toggleTheme() {
        const isDark = document.documentElement.classList.toggle('dark');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
        updateIcons();
        playTactileFeedback();
      }

      toggleBtn.addEventListener('click', toggleTheme);

      // Keyboard Shortcut: Alt + T
      window.addEventListener('keydown', (e) => {
        if (e.altKey && (e.key === 't' || e.key === 'T')) {
          e.preventDefault();
          toggleTheme();
        }
      });

      updateIcons();
    })();
  </script>
</body>
</html>
