{% load static %}
<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Chronicle Blog{% endblock %}</title>

  <!-- Prevent theme flicker before DOM renders -->
  <script>
    if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  </script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>
</head>
<body class="flex min-h-full flex-col font-sans bg-stone-50 text-zinc-900 transition-colors duration-200 antialiased selection:bg-indigo-500 selection:text-white dark:bg-zinc-950 dark:text-zinc-100">

  <!-- Navigation -->
  <header class="sticky top-0 z-40 border-b border-zinc-200/80 bg-stone-50/90 backdrop-blur-md transition-colors duration-200 dark:border-zinc-800 dark:bg-zinc-950/90">
    <div class="mx-auto flex h-16 max-w-6xl items-center justify-between px-4 sm:px-6 lg:px-8">
      <a href="{% url 'home' %}" class="text-xl font-extrabold tracking-tight text-zinc-900 transition hover:opacity-80 dark:text-white">
        CHRONICLE<span class="text-indigo-600 dark:text-indigo-400">.</span>
      </a>
      <nav class="flex items-center gap-6 text-sm font-medium">
        <a href="{% url 'home' %}" class="text-zinc-600 transition hover:text-zinc-950 dark:text-zinc-400 dark:hover:text-white">Home</a>
        <a href="{% url 'all-posts' %}" class="text-zinc-600 transition hover:text-zinc-950 dark:text-zinc-400 dark:hover:text-white">All Posts</a>
      </nav>
    </div>
  </header>

  <!-- Main Content Block -->
  <main class="flex-1 py-10">
    <div class="mx-auto max-w-6xl px-4 sm:px-6 lg:px-8">
      {% block content %}
      {% endblock %}
    </div>
  </main>

  <!-- Floating Interactive Dark Mode Toggle (Bottom-Left) -->
  <aside class="group fixed bottom-6 left-6 z-50 flex items-center gap-3">
    <button 
      id="theme-toggle" 
      type="button" 
      aria-label="Toggle theme"
      class="relative flex h-12 w-12 items-center justify-center rounded-full border border-zinc-200 bg-white text-zinc-700 shadow-xl shadow-zinc-900/5 transition-all duration-200 ease-out hover:scale-110 hover:border-zinc-300 hover:shadow-2xl active:scale-90 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 dark:border-zinc-700 dark:bg-zinc-900 dark:text-zinc-200 dark:focus:ring-offset-zinc-950"
    >
      <!-- Sun Icon (shows in dark mode) -->
      <svg id="theme-toggle-light-icon" class="hidden h-5 w-5 transition-transform duration-500 ease-in-out" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" clip-rule="evenodd"/>
      </svg>
      <!-- Moon Icon (shows in light mode) -->
      <svg id="theme-toggle-dark-icon" class="hidden h-5 w-5 transition-transform duration-500 ease-in-out" viewBox="0 0 20 20" fill="currentColor">
        <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"/>
      </svg>
    </button>

    <!-- Floating Tooltip -->
    <div 
      id="theme-tooltip" 
      class="pointer-events-none translate-x-1 whitespace-nowrap rounded-lg border border-zinc-200 bg-white/95 px-3 py-1.5 text-xs font-semibold tracking-wide text-zinc-700 opacity-0 shadow-md backdrop-blur transition-all duration-200 ease-out group-hover:translate-x-0 group-hover:opacity-100 dark:border-zinc-800 dark:bg-zinc-900/95 dark:text-zinc-200"
    >
      <span id="tooltip-text">Switch mode</span>
      <kbd class="ml-1.5 rounded bg-zinc-100 px-1.5 py-0.5 font-mono text-[10px] text-zinc-500 dark:bg-zinc-800 dark:text-zinc-400">Alt+T</kbd>
    </div>
  </aside>

  <!-- Footer -->
  <footer class="border-t border-zinc-200 bg-white py-8 text-center text-xs text-zinc-400 transition-colors duration-200 dark:border-zinc-800 dark:bg-zinc-950 dark:text-zinc-600">
    <p>&copy; {% now "Y" %} Chronicle Blog. Built with Django & Stitch.</p>
  </footer>

  <!-- Toggle & Interaction Logic -->
  <script>
    const themeToggleBtn = document.getElementById('theme-toggle');
    const lightIcon = document.getElementById('theme-toggle-light-icon');
    const darkIcon = document.getElementById('theme-toggle-dark-icon');
    const tooltipText = document.getElementById('tooltip-text');

    function playTactileClick() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.04);
        gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.04);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.04);
      } catch (e) {}
    }

    function syncState() {
      const isDark = document.documentElement.classList.contains('dark');
      if (isDark) {
        lightIcon.classList.remove('hidden');
        darkIcon.classList.add('hidden');
        tooltipText.textContent = 'Light Mode';
      } else {
        lightIcon.classList.add('hidden');
        darkIcon.classList.remove('hidden');
        tooltipText.textContent = 'Dark Mode';
      }
    }

    function triggerThemeToggle() {
      playTactileClick();

      const activeIcon = document.documentElement.classList.contains('dark') ? lightIcon : darkIcon;
      activeIcon.classList.add('rotate-[360deg]');
      setTimeout(() => activeIcon.classList.remove('rotate-[360deg]'), 500);

      if (document.documentElement.classList.contains('dark')) {
        document.documentElement.classList.remove('dark');
        localStorage.setItem('theme', 'light');
      } else {
        document.documentElement.classList.add('dark');
        localStorage.setItem('theme', 'dark');
      }
      syncState();
    }

    syncState();
    themeToggleBtn.addEventListener('click', triggerThemeToggle);

    window.addEventListener('keydown', (e) => {
      if (e.altKey && (e.key === 't' || e.key === 'T')) {
        e.preventDefault();
        triggerThemeToggle();
      }
    });
  </script>

</body>
</html>
